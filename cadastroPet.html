<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cadastrar Pet · PetTok</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@400;600;700;800&display=swap"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="CSS/cadastroPet.css">
    <link rel="stylesheet" href="CSS/configuracoes.css">
</head>

<body>

<div class="app">

    <!-- =========================
         HEADER
    ========================== -->
<header class="header">
    <svg class="header-wave" viewBox="0 0 395 60" preserveAspectRatio="none" aria-hidden="true">
        <path d="M0,30 Q99,10 197,30 T395,30 L395,60 L0,60 Z" />
    </svg>
    
    <div class="header-content">
        <button
            type="button"
            class="back-button"
            aria-label="Voltar"
            onclick="history.back()"
        >
            <svg viewBox="0 0 24 24">
                <path
                    d="M15 5L8 12L15 19"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                />
            </svg>
        </button>

        <div class="header-title">
            <h1>CADASTRE SEU PET</h1>
            <span>Ajude um pet a encontrar um novo lar</span>
        </div>

        <img src="IMG/patas.png" alt="Pata" class="header-paw" />

    </div>
</header>
    <!-- =========================
         CONTEÚDO
    ========================== -->

    <main class="content">

        <form id="petForm">

            <!-- NOME -->

            <div class="field-row">

                <div class="field-icon">
                    <svg viewBox="0 0 24 24">
                        <path
                            d="M8 21C6 19 4.5 16 4.5 12.5C4.5 8.5 7 5 12 5C17 5 19.5 8.5 19.5 12.5C19.5 16 18 19 16 21"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="1.7"
                            stroke-linecap="round"
                        />

                        <path
                            d="M7 8C5.5 8 4 7 4 5.5"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="1.7"
                            stroke-linecap="round"
                        />

                        <path
                            d="M17 8C18.5 8 20 7 20 5.5"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="1.7"
                            stroke-linecap="round"
                        />
                    </svg>
                </div>

                <div class="field">

                    <label for="nome">NOME:</label>

                    <input
                        type="text"
                        id="nome"
                        name="nome"
                        placeholder="Ex.: Thor"
                        autocomplete="off"
                        required
                    >

                </div>

            </div>


            <!-- ESPÉCIE -->

            <div class="field-row species-row">

                <div class="field-icon paw-small">
                    <svg viewBox="0 0 24 24">
                        <circle cx="7" cy="7" r="2.2" fill="currentColor"/>
                        <circle cx="17" cy="7" r="2.2" fill="currentColor"/>
                        <circle cx="5" cy="12" r="2" fill="currentColor"/>
                        <circle cx="19" cy="12" r="2" fill="currentColor"/>

                        <path
                            d="M12 9C9.2 9 7 12.2 7 15.2C7 18 9.2 20 12 20C14.8 20 17 18 17 15.2C17 12.2 14.8 9 12 9Z"
                            fill="currentColor"
                        />
                    </svg>
                </div>

                <div class="field">

                    <label>ESPÉCIE:</label>

                    <div class="checkbox-group">

                        <label class="check-label">
                            <input
                                type="checkbox"
                                name="especie"
                                value="cachorro"
                            >

                            <span class="fake-check"></span>

                            CACHORRO
                        </label>

                        <label class="check-label">
                            <input
                                type="checkbox"
                                name="especie"
                                value="gato"
                            >

                            <span class="fake-check"></span>

                            GATO
                        </label>

                    </div>

                </div>

            </div>


            <!-- RAÇA -->

            <div class="field-row">

                <div class="field-icon">
                    <svg viewBox="0 0 24 24">
                        <path
                            d="M4 10L12 4L20 10L18 20H6L4 10Z"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="1.6"
                            stroke-linejoin="round"
                        />

                        <path
                            d="M8 20V13H16V20"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="1.6"
                        />
                    </svg>
                </div>

                <div class="field">

                    <label for="raca">RAÇA:</label>

                    <input
                        type="text"
                        id="raca"
                        name="raca"
                        placeholder="Ex.: Golden Retriever"
                        autocomplete="off"
                        required
                    >

                </div>

            </div>


            <!-- IDADE -->

            <div class="field-row">

                <div class="field-icon">
                    <svg viewBox="0 0 24 24">
                        <rect
                            x="4"
                            y="5"
                            width="16"
                            height="16"
                            rx="2"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="1.6"
                        />

                        <path
                            d="M8 3V7M16 3V7M4 10H20"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="1.6"
                            stroke-linecap="round"
                        />

                        <path
                            d="M8 14H8.01M12 14H12.01M16 14H16.01M8 17H8.01M12 17H12.01"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="2"
                            stroke-linecap="round"
                        />
                    </svg>
                </div>

                <div class="field">

                    <label for="idade">IDADE:</label>

                    <input
                        type="number"
                        id="idade"
                        name="idade"
                        min="0"
                        placeholder="Ex.: 3"
                        required
                    >

                </div>

            </div>


            <!-- DESCRIÇÃO -->

            <div class="field-row description-row">

                <div class="field-icon">
                    <svg viewBox="0 0 24 24">
                        <rect
                            x="5"
                            y="3"
                            width="14"
                            height="18"
                            rx="2"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="1.6"
                        />

                        <path
                            d="M8 8H16M8 12H16M8 16H13"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="1.5"
                            stroke-linecap="round"
                        />
                    </svg>
                </div>

                <div class="field">

                    <label for="descricao">
                        DESCRIÇÃO DO ANIMAL:
                    </label>

                    <textarea
                        id="descricao"
                        name="descricao"
                        placeholder="Conte um pouco sobre o pet..."
                    ></textarea>

                </div>

            </div>


            <!-- MICROCHIPADO -->

            <div class="field-row compact-row">

                <div class="field-icon">
                    <svg viewBox="0 0 24 24">
                        <rect
                            x="6"
                            y="6"
                            width="12"
                            height="12"
                            rx="1"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="1.5"
                        />

                        <rect
                            x="9"
                            y="9"
                            width="6"
                            height="6"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="1.4"
                        />

                        <path
                            d="M6 3V6M10 3V6M14 3V6M18 3V6M6 18V21M10 18V21M14 18V21M18 18V21"
                            stroke="currentColor"
                            stroke-width="1.4"
                        />
                    </svg>
                </div>

                <div class="field">

                    <label>MICROCHIPADO:</label>

                    <div class="radio-group">

                        <label class="check-label">

                            <input
                                type="radio"
                                name="microchipado"
                                value="sim"
                            >

                            <span class="fake-check"></span>

                            SIM

                        </label>

                        <label class="check-label">

                            <input
                                type="radio"
                                name="microchipado"
                                value="nao"
                            >

                            <span class="fake-check"></span>

                            NÃO

                        </label>

                    </div>

                </div>

            </div>


            <!-- CASTRADO -->

            <div class="field-row compact-row">

                <div class="field-icon">
                    <svg viewBox="0 0 24 24">
                        <path
                            d="M12 3L20 6V11C20 16 16.8 19.5 12 21C7.2 19.5 4 16 4 11V6L12 3Z"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="1.5"
                        />
                    </svg>
                </div>

                <div class="field">

                    <label>CASTRADO:</label>

                    <div class="radio-group">

                        <label class="check-label">

                            <input
                                type="radio"
                                name="castrado"
                                value="sim"
                            >

                            <span class="fake-check"></span>

                            SIM

                        </label>

                        <label class="check-label">

                            <input
                                type="radio"
                                name="castrado"
                                value="nao"
                            >

                            <span class="fake-check"></span>

                            NÃO

                        </label>

                    </div>

                </div>

            </div>


            <!-- MÍDIA -->

            <div class="media-section">

                <div class="media-title">

                    <svg viewBox="0 0 24 24">
                        <rect
                            x="4"
                            y="5"
                            width="16"
                            height="15"
                            rx="2"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="1.7"
                        />

                        <circle
                            cx="9"
                            cy="10"
                            r="1.5"
                            fill="currentColor"
                        />

                        <path
                            d="M5 18L10 13L13 16L15 14L19 18"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="1.5"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                        />
                    </svg>

                    <span>MÍDIA DO ANIMAL</span>

                </div>


                <label
                    class="upload-area"
                    for="petMedia"
                >

                    <input
                        type="file"
                        id="petMedia"
                        name="petMedia"
                        accept="image/*, video/*"
                    >

                    <div class="upload-icon">

                        <svg viewBox="0 0 24 24">
                            <path
                                d="M12 16V4"
                                fill="none"
                                stroke="currentColor"
                                stroke-width="1.6"
                                stroke-linecap="round"
                            />

                            <path
                                d="M8 8L12 4L16 8"
                                fill="none"
                                stroke="currentColor"
                                stroke-width="1.6"
                                stroke-linecap="round"
                                stroke-linejoin="round"
                            />

                            <path
                                d="M5 14V18C5 19.1 5.9 20 7 20H17C18.1 20 19 19.1 19 18V14"
                                fill="none"
                                stroke="currentColor"
                                stroke-width="1.6"
                                stroke-linecap="round"
                            />
                        </svg>

                    </div>

                    <strong>Clique para enviar uma mídia</strong>

                    <span>ou arraste e solte aqui</span>

                    <img
                        id="previewImg"
                        class="preview"
                        alt="Pré-visualização da imagem do pet"
                    >
                    <video
                    id="preview"
                    class="preview"
                    controls
                    muted
                    playsinline
                    ></video>


                </label>

            </div>


            <!-- BOTÃO -->

            <button
                type="submit"
                class="submit-button"
            >
                Clique para cadastrar
            </button>

        </form>

    </main>


    <!-- =========================
         NAVBAR
    ========================== -->

    <nav class="bottom-nav">

        <!-- INÍCIO -->

    <button class="nav-item" title="Início" onclick="window.location.href='home.html'">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11.5 12 4l9 7.5"/><path d="M5 10v10h14V10"/><path d="M9 20v-6h6v6"/></svg>
    </button>

        <!-- CADASTRAR -->

        <button
            type="button"
            class="nav-item active"
            title="Cadastrar pet"
            aria-label="Cadastrar pet"
            onclick="window.location.href='cadastroPet.html'"
        >

            <svg viewBox="0 0 24 24">
                <path
                    d="M12 5V19M5 12H19"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="1.8"
                    stroke-linecap="round"
                />
            </svg>

        </button>


        <!-- FEED -->

        <button
            type="button"
            class="nav-item central"
            title="Feed"
            aria-label="Feed"
            onclick="window.location.href='feed.html'"
        >

            <div class="central-pets">

                <span>🐶</span>
                <span>🐱</span>
                <span>🐕</span>

            </div>

        </button>


        <!-- MENSAGENS -->

        <button
            type="button"
            class="nav-item"
            title="Mensagens"
            aria-label="Mensagens"
            onclick="alert('Área de mensagens em desenvolvimento.')"
        >

            <svg viewBox="0 0 24 24">
                <path
                    d="M20 11.5A7.5 7.5 0 0 1 12.5 19H7L3 21L4.5 17A7.5 7.5 0 1 1 20 11.5Z"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="1.7"
                    stroke-linejoin="round"
                />
            </svg>

        </button>


        <!-- PERFIL -->

        <button
            type="button"
            class="nav-item"
            title="Perfil"
            aria-label="Perfil"
            onclick="window.location.href='perfil.html'"
        >

            <svg viewBox="0 0 24 24">
                <circle
                    cx="12"
                    cy="8"
                    r="4"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="1.7"
                />

                <path
                    d="M4 20C4 16 8 14 12 14C16 14 20 16 20 20"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="1.7"
                    stroke-linecap="round"
                />
            </svg>

        </button>

    </nav>

</div>

<script src="JS/configuracoes.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="JS/cadastroPet.js"></script>


</body>
</html>
