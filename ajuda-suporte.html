<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ajuda e suporte · PetTok</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="CSS/ajuda-suporte.css">
</head>
<body>
<div class="phone">

  <header class="header">
    <div class="header-content">
      <button class="back-button" onclick="history.back()" aria-label="Voltar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
      </button>
      <div class="header-title">
        <h1>AJUDA E SUPORTE</h1>
        <span>Atendimento virtual do PetTok</span>
      </div>
    </div>
    <svg class="header-wave" viewBox="0 0 395 60" preserveAspectRatio="none" aria-hidden="true">
      <path d="M0,30 Q99,8 197,30 T395,30 L395,60 L0,60 Z"/>
    </svg>
  </header>

  <main class="chat" id="chat">
    <section class="welcome" id="welcome">
      <div class="welcome-icon">
        <svg viewBox="0 0 24 24" fill="currentColor"><circle cx="6" cy="10" r="2"/><circle cx="10" cy="6" r="2"/><circle cx="14" cy="6" r="2"/><circle cx="18" cy="10" r="2"/><path d="M12 12c-3 0-6 3-6 5.5 0 1.7 1.4 2.5 3 2.5 1.2 0 2-.5 3-.5s1.8.5 3 .5c1.6 0 3-.8 3-2.5 0-2.5-3-5.5-6-5.5z"/></svg>
      </div>
      <h2>Como posso te ajudar?</h2>
      <p>Sou a assistente virtual do PetTok. Tire dúvidas sobre cadastro de pets, adoção e sua conta.</p>
      <div class="chips">
        <button class="chip" type="button">Como cadastro um pet?</button>
        <button class="chip" type="button">Como funciona a adoção?</button>
        <button class="chip" type="button">Como edito meu perfil?</button>
        <button class="chip" type="button">Esqueci minha senha</button>
      </div>
    </section>
    <div class="messages" id="messages" aria-live="polite"></div>
  </main>

  <form class="composer" id="composer">
    <textarea id="input" rows="1" placeholder="Digite sua dúvida..." aria-label="Digite sua dúvida"></textarea>
    <button class="send-btn" id="sendBtn" type="submit" aria-label="Enviar" disabled>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
    </button>
  </form>

  <nav class="bottom-nav">
    <button class="nav-item" title="Início" aria-label="Início" onclick="window.location.href='home.html'">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11.5 12 4l9 7.5"/><path d="M5 10v10h14V10"/><path d="M9 20v-6h6v6"/></svg>
    </button>
    <button class="nav-item" title="Cadastrar pet" aria-label="Cadastrar pet" onclick="window.location.href='cadastroPet.html'">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14"/><path d="M5 12h14"/></svg>
    </button>
    <div class="nav-center" title="Feed" aria-label="Feed" onclick="window.location.href='feed.html'"></div>
    <button class="nav-item" title="Mensagens" aria-label="Mensagens" onclick="window.location.href='conversas.html'">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11.5a7.5 7.5 0 0 1-7.5 7.5H7l-4 2 1.5-4A7.5 7.5 0 1 1 20 11.5Z"/></svg>
    </button>
    <button class="nav-item active" title="Perfil" aria-label="Perfil" onclick="window.location.href='perfil.html'">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 4-6 8-6s8 2 8 6"/></svg>
    </button>
  </nav>

</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="JS/tema.js"></script>
<script src="JS/ajuda-suporte.js"></script>
</body>
</html>
