<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pets favoritos · PetTok</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="CSS/configuracoes.css">
<link rel="stylesheet" href="CSS/config-telas.css">

</head>
<body>
<div class="phone">
  <header class="settings-header">
    <svg class="header-wave" viewBox="0 0 395 40" preserveAspectRatio="none" aria-hidden="true"><path d="M0,20 Q99,7 197,20 T395,20 L395,40 L0,40 Z"/></svg>
    <button class="back-btn" onclick="location.href='configuracoes.html'" aria-label="Voltar"><svg viewBox="0 0 24 24"><path d="M19 12H5M12 19l-7-7 7-7"/></svg></button>
    <div class="header-title"><h1>PETS FAVORITOS</h1><span>Os pets que você curtiu</span></div>
  </header>
  <main class="settings-content">
    <div class="filter-tabs" id="abas">
      <button class="filter-tab active" data-f="todos">Todos</button>
      <button class="filter-tab" data-f="cachorro">Cães</button>
      <button class="filter-tab" data-f="gato">Gatos</button>
      <button class="filter-tab" data-f="outro">Outros</button>
    </div>
    <div id="lista"><div class="empty">Carregando...</div></div>
  </main>
  <nav class="bottom-nav">
<button class="nav-item" title="Início" onclick="location.href='home.html'"><svg viewBox="0 0 24 24"><path d="M3 11.5 12 4l9 7.5"/><path d="M5 10v10h14V10"/><path d="M9 20v-6h6v6"/></svg></button>
<button class="nav-item" title="Cadastrar" onclick="location.href='cadastroPet.html'"><svg viewBox="0 0 24 24"><path d="M12 5v14"/><path d="M5 12h14"/></svg></button>
<div class="nav-center" title="Feed" onclick="location.href='feed.html'"></div>
<button class="nav-item" title="Mensagens" onclick="location.href='conversas.html'"><svg viewBox="0 0 24 24"><path d="M20 11.5a7.5 7.5 0 0 1-7.5 7.5H7l-4 2 1.5-4A7.5 7.5 0 1 1 20 11.5Z"/></svg></button>
<button class="nav-item active" title="Perfil" onclick="location.href='perfil.html'"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 4-6 8-6s8 2 8 6"/></svg></button>
</nav>
  <div id="toast" class="toast"></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="JS/tema.js"></script>
<script src="JS/config-comum.js"></script>
<script src="JS/favoritos.js"></script>
</body>
</html>
