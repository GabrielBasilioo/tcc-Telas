<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Início · PetTok</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --orange: #FF7A29;
    --orange-dark: #F26A15;
    --orange-light: #FFA35C;
    --gray-text: #8A8A8F;
    --gray-icon: #B9B9C0;
    --bg-page: #EDEDED;
  }

  *{ box-sizing: border-box; margin:0; padding:0; }

  body{
    background: var(--bg-page);
    font-family: 'Nunito', sans-serif;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    padding: 24px 0;
  }

  .phone{
    width: 395px;
    max-width: 100vw;
    height: 800px;
    background: #fff;
    border-radius: 28px;
    overflow: hidden;
    box-shadow: 0 20px 50px rgba(0,0,0,0.18);
    position: relative;
  }

  /* ---------- MAPA ---------- */
  .map-frame{
    width:100%;
    height:100%;
    border:none;
    display:block;
    filter: saturate(0.9);
  }

  /* ---------- CARTÃO "QUAL PET DESEJA ADOTAR" ---------- */
  .search-card{
    position:absolute;
    left: 16px;
    right: 16px;
    bottom: 100px;
    background:#fff;
    border-radius: 20px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.18);
    padding: 18px 18px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap: 12px;
    z-index: 5;
  }

  .search-card span{
    font-family:'Baloo 2', sans-serif;
    font-weight: 700;
    font-size: 16.5px;
    color:#1F1F1F;
  }

  .filter-btn{
    width: 42px;
    height: 42px;
    border-radius: 12px;
    border: 1.5px solid #EDEBE8;
    background:#FBF8F5;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    flex-shrink:0;
    position:relative;
  }

  .filter-btn svg{ width:19px; height:19px; color:#3f3f3f; }


  .filter-badge{
    position:absolute;
    top:-5px;
    right:-5px;
    background: var(--orange);
    color:#fff;
    font-size: 10px;
    font-weight:800;
    min-width:16px;
    height:16px;
    border-radius:50%;
    display:none;
    align-items:center;
    justify-content:center;
  }

  /* ---------- BOTTOM NAV ---------- */
  .bottom-nav{
    position:absolute;
    bottom:0;
    left:0;
    right:0;
    height: 78px;
    background:#fff;
    border-radius: 26px 26px 0 0;
    box-shadow: 0 -6px 24px rgba(0,0,0,0.06);
    display:flex;
    align-items:center;
    justify-content:space-around;
    padding: 0 8px;
    z-index: 6;
  }

  .nav-item{
    background:none;
    border:none;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    color: var(--gray-icon);
    width: 40px;
    height: 40px;
  }

  .nav-item svg, .nav-item img{ width:24px; height:24px; object-fit:contain; }

  .nav-item.active{ color: var(--orange); }

  .nav-center{
    width: 62px;
    height: 62px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--orange-light), var(--orange));
    display:flex;
    align-items:center;
    justify-content:center;
    margin-top: -30px;
    box-shadow: 0 10px 20px rgba(255,122,41,0.4);
    border: 4px solid #fff;
    overflow:hidden;
  }

  .nav-center img{ width:100%; height:100%; object-fit:cover; display:block; }

  /* ---------- PAINEL DE FILTROS ---------- */
  .filter-overlay{
    position:absolute;
    inset:0;
    background: rgba(0,0,0,0.35);
    display:none;
    align-items:flex-end;
    z-index: 10;
  }

  .filter-overlay.open{ display:flex; }

  .filter-panel{
    background:#fff;
    width:100%;
    max-height: 82%;
    border-radius: 24px 24px 0 0;
    padding: 22px 22px 20px;
    overflow-y:auto;
  }

  .filter-panel-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom: 18px;
  }

  .filter-panel-header h2{
    font-family:'Baloo 2', sans-serif;
    font-weight:700;
    font-size: 20px;
    color:#1F1F1F;
  }

  .close-filter{
    background:#F3F1EF;
    border:none;
    width:32px;
    height:32px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
  }

  .close-filter svg{ width:14px; height:14px; }

  .filter-group{ margin-bottom: 22px; }

  .filter-group h3{
    font-size: 13px;
    font-weight: 800;
    color:#4a4a4a;
    text-transform: uppercase;
    letter-spacing: 0.4px;
    margin-bottom: 10px;
  }

  .chip-row{
    display:flex;
    flex-wrap:wrap;
    gap: 8px;
  }

  .chip{
    padding: 9px 16px;
    border-radius: 30px;
    border: 1.5px solid #E4E2DF;
    background:#fff;
    font-size: 13px;
    font-weight: 700;
    color: #4a4a4a;
    cursor:pointer;
  }

  .chip.selected{
    background: linear-gradient(135deg, var(--orange), var(--orange-dark));
    border-color: transparent;
    color:#fff;
  }

  .range-row{
    display:flex;
    align-items:center;
    gap:12px;
  }

  .range-row input[type="range"]{
    flex:1;
    accent-color: var(--orange);
  }

  .range-value{
    font-weight:800;
    font-size: 13.5px;
    color: var(--orange-dark);
    min-width: 56px;
    text-align:right;
  }

  .apply-btn{
    width:100%;
    background: linear-gradient(135deg, var(--orange), var(--orange-dark));
    color:#fff;
    border:none;
    border-radius: 30px;
    padding: 14px 0;
    font-family:'Baloo 2', sans-serif;
    font-weight: 700;
    font-size: 17px;
    cursor:pointer;
    margin-top: 6px;
  }

  .clear-btn{
    width:100%;
    background:none;
    border:none;
    color: var(--gray-text);
    font-weight: 700;
    font-size: 13px;
    padding: 12px 0 0;
    cursor:pointer;
  }

  

</style>
</head>
<body>

  <div class="phone">

    <!-- MAPA (embed simples, sem API key — depois trocar pela Maps JavaScript API) -->
    <iframe
      class="map-frame"
      src="https://maps.google.com/maps?q=São+Paulo&z=13&output=embed"
      loading="lazy"
      allowfullscreen>
    </iframe>

    <!-- CARTÃO DE BUSCA -->
    <div class="search-card">
      <span>Qual pet deseja adotar?</span>
      <div class="filter-btn" id="openFilter" aria-label="Abrir filtros">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="4" y1="6" x2="20" y2="6"/><circle cx="9" cy="6" r="2" fill="#fff"/>
          <line x1="4" y1="12" x2="20" y2="12"/><circle cx="15" cy="12" r="2" fill="#fff"/>
          <line x1="4" y1="18" x2="20" y2="18"/><circle cx="11" cy="18" r="2" fill="#fff"/>
        </svg>
        <span class="filter-badge" id="filterBadge">0</span>
      </div>
    </div>

    <!-- BOTTOM NAV -->
    <nav class="bottom-nav">
      <button class="nav-item active" aria-label="Início">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11.5 12 4l9 7.5"/><path d="M5 10v10h14V10"/><path d="M9 20v-6h6v6"/></svg>
  
      </button>
      <button class="nav-item" aria-label="Adoção">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <path d="M12 5v14"/>
  <path d="M5 12h14"/>
</svg>
      </button>
      <div class="nav-center">
         
      </div>
      <button class="nav-item" aria-label="Nova mensagem">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11.5a7.5 7.5 0 0 1-7.5 7.5H7l-4 2 1.5-4A7.5 7.5 0 1 1 20 11.5Z"/></svg>

      </button>
      <button class="nav-item" aria-label="Perfil" onclick="window.location.href='perfil.html'">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 4-6 8-6s8 2 8 6"/></svg>
 
      </button>
    </nav>

    <!-- PAINEL DE FILTROS -->
    <div class="filter-overlay" id="filterOverlay">
      <div class="filter-panel">

        <div class="filter-panel-header">
          <h2>Filtrar pets</h2>
          <button class="close-filter" id="closeFilter" aria-label="Fechar">
            <svg viewBox="0 0 24 24" fill="none" stroke="#4a4a4a" stroke-width="2.4" stroke-linecap="round"><line x1="4" y1="4" x2="20" y2="20"/><line x1="20" y1="4" x2="4" y2="20"/></svg>
          </button>
        </div>

        <div class="filter-group">
          <h3>Tipo de pet</h3>
          <div class="chip-row" data-group="tipo">
            <button class="chip" data-value="cachorro">Cachorro</button>
            <button class="chip" data-value="gato">Gato</button>
            <button class="chip" data-value="outro">Outro</button>
          </div>
        </div>

        <div class="filter-group">
          <h3>Porte</h3>
          <div class="chip-row" data-group="porte">
            <button class="chip" data-value="pequeno">Pequeno</button>
            <button class="chip" data-value="medio">Médio</button>
            <button class="chip" data-value="grande">Grande</button>
          </div>
        </div>

        <div class="filter-group">
          <h3>Idade</h3>
          <div class="chip-row" data-group="idade">
            <button class="chip" data-value="filhote">Filhote</button>
            <button class="chip" data-value="adulto">Adulto</button>
            <button class="chip" data-value="idoso">Idoso</button>
          </div>
        </div>

        <div class="filter-group">
          <h3>Saúde</h3>
          <div class="chip-row" data-group="saude">
            <button class="chip" data-value="vacinado">Vacinado</button>
            <button class="chip" data-value="castrado">Castrado</button>
          </div>
        </div>

        <div class="filter-group">
          <h3>Distância</h3>
          <div class="range-row">
            <input type="range" id="distanceRange" min="1" max="50" value="10">
            <span class="range-value" id="distanceValue">10 km</span>
          </div>
        </div>

        <button class="apply-btn" id="applyFilters">Aplicar filtros</button>
        <button class="clear-btn" id="clearFilters">Limpar tudo</button>

      </div>
    </div>

  </div>

  <script>
    // ---- Proteção da página: só entra quem está logado ----
    const SUPABASE_URL = 'https://blpueqrzgqypkabjnvlu.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_b3ObyBNc_RiI5yoq8klo-Q_aSfOYVAg';

    let supabaseClient = null;
    try{
      supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
      supabaseClient.auth.getSession().then(({ data }) => {
        if(!data.session){
          window.location.href = 'login.html';
        }
      });
    } catch(err){
      console.error('Não foi possível conectar ao Supabase:', err);
    }

    // ---- Painel de filtros ----
    const filterOverlay = document.getElementById('filterOverlay');
    const openFilter = document.getElementById('openFilter');
    const closeFilter = document.getElementById('closeFilter');
    const filterBadge = document.getElementById('filterBadge');
    const applyFilters = document.getElementById('applyFilters');
    const clearFilters = document.getElementById('clearFilters');
    const distanceRange = document.getElementById('distanceRange');
    const distanceValue = document.getElementById('distanceValue');

    const selected = { tipo: null, porte: null, idade: null, saude: new Set() };

    openFilter.addEventListener('click', () => filterOverlay.classList.add('open'));
    closeFilter.addEventListener('click', () => filterOverlay.classList.remove('open'));
    filterOverlay.addEventListener('click', (e) => {
      if(e.target === filterOverlay) filterOverlay.classList.remove('open');
    });

    document.querySelectorAll('.chip-row').forEach(row => {
      const group = row.dataset.group;
      row.querySelectorAll('.chip').forEach(chip => {
        chip.addEventListener('click', () => {
          const value = chip.dataset.value;

          if(group === 'saude'){
            // múltipla escolha
            if(selected.saude.has(value)){
              selected.saude.delete(value);
              chip.classList.remove('selected');
            } else {
              selected.saude.add(value);
              chip.classList.add('selected');
            }
          } else {
            // escolha única por grupo
            const alreadySelected = chip.classList.contains('selected');
            row.querySelectorAll('.chip').forEach(c => c.classList.remove('selected'));
            if(!alreadySelected){
              chip.classList.add('selected');
              selected[group] = value;
            } else {
              selected[group] = null;
            }
          }
        });
      });
    });

    distanceRange.addEventListener('input', () => {
      distanceValue.textContent = distanceRange.value + ' km';
    });

    function countActiveFilters(){
      let count = 0;
      if(selected.tipo) count++;
      if(selected.porte) count++;
      if(selected.idade) count++;
      count += selected.saude.size;
      return count;
    }

    applyFilters.addEventListener('click', () => {
      const count = countActiveFilters();
      filterBadge.style.display = count > 0 ? 'flex' : 'none';
      filterBadge.textContent = count;
      filterOverlay.classList.remove('open');

      // Isso aqui é onde, futuramente, os filtros são usados para
      // consultar a tabela de pets no Supabase e atualizar os pins do mapa.
      console.log('Filtros aplicados:', {
        tipo: selected.tipo,
        porte: selected.porte,
        idade: selected.idade,
        saude: Array.from(selected.saude),
        distanciaKm: distanceRange.value
      });
    });

    clearFilters.addEventListener('click', () => {
      selected.tipo = null;
      selected.porte = null;
      selected.idade = null;
      selected.saude.clear();
      document.querySelectorAll('.chip.selected').forEach(c => c.classList.remove('selected'));
      distanceRange.value = 10;
      distanceValue.textContent = '10 km';
      filterBadge.style.display = 'none';
    });
  </script>

</body>
</html>
