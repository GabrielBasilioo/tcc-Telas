<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nova senha · PetTok</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --orange: #FF7A29;
    --orange-dark: #F26A15;
    --orange-light: #FFA35C;
    --bg-page: #EDEDED;
  }

  *{ box-sizing: border-box; margin:0; padding:0; }

  body{
    background: var(--bg-page);
    font-family: 'Nunito', sans-serif;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    padding: 24px 0;
  }

  .phone{
    width: 395px;
    max-width: 100vw;
    min-height: 800px;
    background: linear-gradient(160deg, var(--orange-light) 0%, var(--orange) 45%, var(--orange-dark) 100%);
    border-radius: 28px;
    overflow: hidden;
    box-shadow: 0 20px 50px rgba(0,0,0,0.18);
    position: relative;
    padding: 56px 32px 40px;
    display:flex;
    flex-direction:column;
  }

  .phone::before{
    content:"";
    position:absolute;
    top:0; left:0;
    width: 90px;
    height: 90px;
    background: var(--bg-page);
    border-bottom-right-radius: 60px;
  }

  h1.title{
    font-family:'Baloo 2', sans-serif;
    font-weight: 700;
    font-size: 32px;
    color:#fff;
    text-align:center;
    margin-bottom: 14px;
  }

  .subtitle{
    color:#fff;
    text-align:center;
    font-size: 13.5px;
    font-weight: 600;
    line-height: 1.5;
    opacity: 0.9;
    margin-bottom: 40px;
  }

  form{ display:flex; flex-direction:column; }

  .field{ margin-bottom: 30px; }

  .field label{
    display:flex;
    align-items:center;
    gap:8px;
    color:#fff;
    font-weight: 700;
    font-size: 15px;
    margin-bottom: 10px;
  }

  .field label svg{ width:17px; height:17px; }

  .field input{
    width:100%;
    background:transparent;
    border:none;
    border-bottom: 1.5px solid rgba(255,255,255,0.85);
    color:#fff;
    font-family:'Nunito', sans-serif;
    font-size: 15px;
    font-weight: 600;
    padding: 4px 2px 10px;
    outline:none;
  }

  .field input::placeholder{ color: rgba(255,255,255,0.65); }

  .submit-btn{
    width:100%;
    background:#fff;
    color: var(--orange-dark);
    border:none;
    border-radius: 30px;
    padding: 15px 0;
    font-family:'Baloo 2', sans-serif;
    font-weight: 700;
    font-size: 20px;
    cursor:pointer;
    box-shadow: 0 10px 22px rgba(0,0,0,0.15);
  }

  .submit-btn:disabled{ opacity: 0.7; cursor:default; }

  .status-msg{
    text-align:center;
    color:#fff;
    font-size: 13px;
    font-weight: 700;
    margin-top: 16px;
    min-height: 18px;
    line-height:1.5;
  }

  .status-msg.error{ color: #3a1200; }

  .back-link{
    text-align:center;
    margin-top: 26px;
  }

  .back-link a{
    color:#fff;
    font-weight: 800;
    font-size: 13.5px;
    text-decoration: underline;
  }

  #invalidLinkMsg{
    display:none;
    color:#fff;
    text-align:center;
    font-size: 14px;
    font-weight:700;
    line-height:1.6;
  }
</style>
</head>
<body>

  <div class="phone">

    <h1 class="title">Nova senha</h1>

    <div id="formArea">
      <p class="subtitle">Crie uma nova senha para sua conta.</p>

      <form id="newPasswordForm">
        <div class="field">
          <label>
            <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="10" width="16" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>
            Nova senha
          </label>
          <input type="password" id="newPassword" placeholder="••••••••" required minlength="6">
        </div>

        <div class="field">
          <label>
            <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="10" width="16" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>
            Confirmar senha
          </label>
          <input type="password" id="confirmPassword" placeholder="••••••••" required minlength="6">
        </div>

        <button type="submit" class="submit-btn" id="submitBtn">Salvar nova senha</button>

        <p class="status-msg" id="statusMsg"></p>
      </form>
    </div>

    <p id="invalidLinkMsg">
      Este link de redefinição não é válido ou já expirou.<br><br>
      Volte para o login e clique em "Esqueceu a senha?" para gerar um novo link.
    </p>

    <div class="back-link">
      <a href="index.html">Voltar para o login</a>
    </div>

  </div>

  <script>
    const SUPABASE_URL = 'https://blpueqrzgqypkabjnvlu.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_b3ObyBNc_RiI5yoq8klo-Q_aSfOYVAg';

    const formArea = document.getElementById('formArea');
    const invalidLinkMsg = document.getElementById('invalidLinkMsg');
    const form = document.getElementById('newPasswordForm');
    const submitBtn = document.getElementById('submitBtn');
    const statusMsg = document.getElementById('statusMsg');

    let supabaseClient = null;

    try{
      supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
      verificarLink();
    } catch(err){
      mostrarLinkInvalido();
    }

    async function verificarLink(){
      // O Supabase lê automaticamente o token de recuperação que vem na URL
      // (depois do clique no link do e-mail) e cria uma sessão temporária.
      const { data } = await supabaseClient.auth.getSession();

      if(!data.session){
        mostrarLinkInvalido();
      }
    }

    function mostrarLinkInvalido(){
      formArea.style.display = 'none';
      invalidLinkMsg.style.display = 'block';
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      const novaSenha = document.getElementById('newPassword').value;
      const confirmar = document.getElementById('confirmPassword').value;

      statusMsg.classList.remove('error');

      if(novaSenha !== confirmar){
        statusMsg.textContent = 'As senhas não coincidem.';
        statusMsg.classList.add('error');
        return;
      }

      submitBtn.disabled = true;
      statusMsg.textContent = 'Salvando...';

      const { error } = await supabaseClient.auth.updateUser({ password: novaSenha });

      if(error){
        submitBtn.disabled = false;
        statusMsg.textContent = error.message;
        statusMsg.classList.add('error');
        return;
      }

      statusMsg.textContent = 'Senha redefinida! Levando você para o login...';

      // Desloga da sessão temporária de redefinição, para a pessoa
      // entrar de novo já usando a senha nova, do zero.
      await supabaseClient.auth.signOut();

      setTimeout(() => { window.location.href = 'index.html'; }, 1800);
    });
  </script>

</body>
</html>
