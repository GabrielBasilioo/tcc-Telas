<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login · PetTok</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --orange: #FF7A29;
    --orange-dark: #F26A15;
    --orange-light: #FFA35C;
    --bg-page: #EDEDED;
  }

  *{ box-sizing: border-box; margin:0; padding:0; }

  body{
    background: var(--bg-page);
    font-family: 'Nunito', sans-serif;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    padding: 24px 0;
  }

  .phone{
    width: 395px;
    max-width: 100vw;
    min-height: 800px;
    background: linear-gradient(160deg, var(--orange-light) 0%, var(--orange) 45%, var(--orange-dark) 100%);
    border-radius: 28px;
    overflow: hidden;
    box-shadow: 0 20px 50px rgba(0,0,0,0.18);
    position: relative;
    padding: 56px 32px 40px;
    display:flex;
    flex-direction:column;
  }

  .phone::before{
    content:"";
    position:absolute;
    top:0; left:0;
    width: 90px;
    height: 90px;
    background: var(--bg-page);
    border-bottom-right-radius: 60px;
  }

  h1.title{
    font-family:'Baloo 2', sans-serif;
    font-weight: 700;
    font-size: 42px;
    color:#fff;
    text-align:center;
    margin-bottom: 44px;
  }

  form{ display:flex; flex-direction:column; }

  .field{
    margin-bottom: 30px;
  }

  .field label{
    display:flex;
    align-items:center;
    gap:8px;
    color:#fff;
    font-weight: 700;
    font-size: 15px;
    margin-bottom: 10px;
  }

  .field label svg{ width:17px; height:17px; }

  .field input{
    width:100%;
    background:transparent;
    border:none;
    border-bottom: 1.5px solid rgba(255,255,255,0.85);
    color:#fff;
    font-family:'Nunito', sans-serif;
    font-size: 15px;
    font-weight: 600;
    padding: 4px 2px 10px;
    outline:none;
  }

  .field input::placeholder{ color: rgba(255,255,255,0.65); }

  .forgot{
    text-align:right;
    margin-top: -14px;
    margin-bottom: 26px;
  }

  .forgot a{
    color:#3a2a1a;
    font-size: 12.5px;
    font-weight: 700;
    text-decoration:none;
  }

  .submit-btn{
    width:100%;
    background:#fff;
    color: var(--orange-dark);
    border:none;
    border-radius: 30px;
    padding: 15px 0;
    font-family:'Baloo 2', sans-serif;
    font-weight: 700;
    font-size: 22px;
    cursor:pointer;
    box-shadow: 0 10px 22px rgba(0,0,0,0.15);
  }

  .submit-btn:disabled{ opacity: 0.7; cursor:default; }

  .status-msg{
    text-align:center;
    color:#fff;
    font-size: 13px;
    font-weight: 700;
    margin-top: 16px;
    min-height: 18px;
  }

  .status-msg.error{ color: #3a1200; }

  .switch-mode{
    text-align:center;
    margin-top: 18px;
  }

  .switch-mode button{
    background:none;
    border:none;
    color:#fff;
    font-weight: 800;
    font-size: 13.5px;
    text-decoration: underline;
    cursor:pointer;
  }

  .divider-text{
    text-align:center;
    color:#fff;
    font-weight: 700;
    font-size: 14px;
    margin: 30px 0 20px;
  }

  .socials{
    display:flex;
    justify-content:center;
    gap: 18px;
  }

  .social-btn{
    width: 54px;
    height: 54px;
    border-radius:50%;
    border: 2px solid #fff;
    background:transparent;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
    cursor:pointer;
  }

  .social-btn img{ width:60%; height:60%; object-fit:contain; }

  #signupExtra{ display:none; }
</style>
</head>
<body>

  <div class="phone">

    <h1 class="title" id="formTitle">Login</h1>

    <form id="authForm">

      <div class="field" id="usernameField" style="display:none;">
        <label>
          <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 4-6 8-6s8 2 8 6"/></svg>
          Usuário
        </label>
        <input type="text" id="username" placeholder="Como quer ser chamado(a)">
      </div>

      <div class="field">
        <label>
          <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>
          Email
        </label>
        <input type="email" id="email" placeholder="seuemail@exemplo.com" required>
      </div>

      <div class="field">
        <label>
          <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="10" width="16" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>
          Senha
        </label>
        <input type="password" id="password" placeholder="••••••••" required minlength="6">
      </div>

      <div class="forgot" id="forgotWrap">
        <a href="#" id="forgotLink">Esqueceu a senha?</a>
      </div>

      <button type="submit" class="submit-btn" id="submitBtn">Login</button>

      <p class="status-msg" id="statusMsg"></p>

      <div class="switch-mode">
        <button type="button" id="switchModeBtn">Não tem conta? Cadastre-se</button>
      </div>

    </form>

    <p class="divider-text">Ou entre com</p>
    <div class="socials">
      <button class="social-btn" aria-label="Entrar com Google"><img src="" alt="" onerror="this.style.display='none'"></button>
      <button class="social-btn" aria-label="Entrar com Apple"><img src="" alt="" onerror="this.style.display='none'"></button>
      <button class="social-btn" aria-label="Entrar com Facebook"><img src="" alt="" onerror="this.style.display='none'"></button>
    </div>

  </div>

  <script>
    // ---- Elementos da tela (isso sempre funciona, não depende de internet) ----
    let mode = 'login'; // ou 'signup'

    const formTitle = document.getElementById('formTitle');
    const usernameField = document.getElementById('usernameField');
    const forgotWrap = document.getElementById('forgotWrap');
    const submitBtn = document.getElementById('submitBtn');
    const switchModeBtn = document.getElementById('switchModeBtn');
    const statusMsg = document.getElementById('statusMsg');
    const authForm = document.getElementById('authForm');

    function setMode(newMode){
      mode = newMode;
      statusMsg.textContent = '';
      if(mode === 'signup'){
        formTitle.textContent = 'Cadastro';
        usernameField.style.display = 'block';
        forgotWrap.style.visibility = 'hidden';
        submitBtn.textContent = 'Cadastrar';
        switchModeBtn.textContent = 'Já tem conta? Entrar';
      } else {
        formTitle.textContent = 'Login';
        usernameField.style.display = 'none';
        forgotWrap.style.visibility = 'visible';
        submitBtn.textContent = 'Login';
        switchModeBtn.textContent = 'Não tem conta? Cadastre-se';
      }
    }

    switchModeBtn.addEventListener('click', () => {
      setMode(mode === 'login' ? 'signup' : 'login');
    });

    // ---- Conexão com o Supabase ----
    // ⚠️ A chave abaixo é a "anon/publishable" — segura para expor no front-end,
    // desde que o RLS esteja ativo nas suas tabelas (já está).
    const SUPABASE_URL = 'https://blpueqrzgqypkabjnvlu.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_b3ObyBNc_RiI5yoq8klo-Q_aSfOYVAg';

    let supabaseClient = null;
    try{
      supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    } catch(err){
      statusMsg.textContent = 'Não foi possível conectar ao Supabase. Verifique sua internet e recarregue a página.';
      statusMsg.classList.add('error');
    }

    document.getElementById('forgotLink').addEventListener('click', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value;
      if(!email){
        statusMsg.textContent = 'Digite seu email acima primeiro.';
        return;
      }
      const { error } = await supabaseClient.auth.resetPasswordForEmail(email);
      statusMsg.textContent = error ? error.message : 'Enviamos um link de recuperação para seu email.';
    });

    authForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      statusMsg.classList.remove('error');

      if(!supabaseClient){
        statusMsg.textContent = 'Sem conexão com o Supabase. Recarregue a página com internet ativa.';
        statusMsg.classList.add('error');
        return;
      }

      statusMsg.textContent = mode === 'signup' ? 'Criando conta...' : 'Entrando...';
      submitBtn.disabled = true;

      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      if(mode === 'signup'){
        const username = document.getElementById('username').value.trim();

        const { data, error } = await supabaseClient.auth.signUp({
          email,
          password,
          options: { data: { username } }
        });

        if(error){
          statusMsg.textContent = error.message;
          statusMsg.classList.add('error');
        } else if(data.session){
          statusMsg.textContent = 'Conta criada! Você já está logado(a).';
        } else {
          statusMsg.textContent = 'Conta criada! Verifique seu email para confirmar.';
        }

      } else {
        const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });

        if(error){
          statusMsg.textContent = error.message;
          statusMsg.classList.add('error');
        } else {
          statusMsg.textContent = 'Login realizado com sucesso!';
          window.location.href = 'home.html';
        }
      }

      submitBtn.disabled = false;
    });
  </script>

</body>
</html>
